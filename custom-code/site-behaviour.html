<style>
/* Hide click focus rings; keep them for keyboard users */
:where(a,button,summary,details,[role=tab],[tabindex]):focus:not(:focus-visible){outline:none !important}
/* Growth Consulting site behaviour: mega menu motion and open state. Content and layout live in Elementor. */
details.gc-mega-item > summary::-webkit-details-marker{display:none}
details.gc-mega-item > summary{box-shadow:inset 0 0 0 transparent;transition:box-shadow .2s}
details.gc-mega-item[open] > summary{box-shadow:inset 0 -2px 0 var(--signal)}
details.gc-mega-item > summary .gc-plus{transition:transform .2s}
details.gc-mega-item[open] > summary .gc-plus{transform:rotate(45deg)}
.gc-mega-scrim{position:fixed;inset:0;background:rgba(17,18,20,.16);opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
html.gc-mega-open .gc-mega-scrim{opacity:1;pointer-events:auto}
@keyframes gcMegaIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes gcMegaUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes gcPop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.gc-calc .gc-pop{animation:gcPop .35s ease-out}
@media (prefers-reduced-motion:no-preference){
 details.gc-mega-item[open] > .gc-mega-panel{animation:gcMegaIn .22s cubic-bezier(.2,.7,.2,1) both}
 details.gc-mega-item[open] > .gc-mega-panel > * > *{animation:gcMegaUp .34s cubic-bezier(.2,.7,.2,1) both}
 details.gc-mega-item[open] > .gc-mega-panel > * > *:nth-child(2){animation-delay:.04s}
 details.gc-mega-item[open] > .gc-mega-panel > * > *:nth-child(3){animation-delay:.08s}
}
/* Contact form: day and time pills */
.gc-slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%}
.gc-slots-t{grid-template-columns:repeat(3,minmax(0,1fr))}
.gc-slot{appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:8px 6px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;line-height:1.25;text-align:center;white-space:normal;cursor:pointer;transition:border-color .15s,background-color .15s,color .15s}
.gc-slot small{font-size:12px;color:var(--ink-3)}
.gc-slot small:empty{display:none}
.gc-slot:hover{border-color:var(--ink)}
.gc-slot[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gc-slot[aria-checked=true] small{color:var(--surface);opacity:.75}
.gc-slot:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
/* Go-to-market diagnostic, week-by-week timeline: draw the gradient as a 2px rule through the dots.
   Elementor's atomic styles can't store background size/position for gradients, so it lives here. */
.elementor-element-4f882440{background-repeat:no-repeat !important;background-size:100% 2px !important;background-position:0 6px !important}
@media (max-width:767px){.elementor-element-4f882440{background-image:none !important;row-gap:var(--space-6)}}
/* Home page industry ticker: two identical copies side by side, scrolled left by one copy's width and looped */
.elementor-element-2e05c5d3{width:max-content;max-width:none;animation:gcTicker 45s linear infinite;will-change:transform}
.elementor-element-2e05c5d3>.gc-eyebrow{white-space:nowrap;flex:0 0 auto}
.elementor-element-4c0ad54b:hover .elementor-element-2e05c5d3{animation-play-state:paused}
@keyframes gcTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.elementor-element-2e05c5d3{animation:none}}
/* Fintech page audience tabs: centre the tab menu like the hero (Elementor dropped its margin-inline:auto) */
.elementor .e-tabs-menu-base[data-id="5584f008"]{--margin-left:auto;--margin-right:auto;margin-inline:auto}
/* Slots already booked on the Google Calendar */
.gc-slot:disabled,.gc-slot:disabled:hover{border-color:var(--line);background:transparent;color:var(--ink-3);opacity:.45;text-decoration:line-through;cursor:not-allowed}
.gc-sr{position:absolute!important;left:0;bottom:0;width:1px!important;height:1px!important;min-height:0!important;padding:0!important;border:0!important;opacity:0!important;clip-path:inset(50%);pointer-events:none}
@media (max-width:480px){.gc-slot{font-size:13px;padding:6px 2px}}
.gc-slots-f{grid-template-columns:repeat(4,minmax(0,1fr))}
.gc-slots-f .gc-slot{min-height:48px;font-size:14px}
.gc-slot[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.gc-hide-js{display:none!important}
.gc-addlink{grid-column:1/-1;justify-self:start;background:none;border:0;padding:0;font:inherit;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
@media (max-width:600px){.gc-slots-f{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Header logos: show one link per breakpoint */
@media (min-width:768px){a:has(> [data-id="7d1d19d1"]){display:none!important}}
@media (max-width:767px){a:has(> [data-id="e3d0fbd"]){display:none!important}}
/* Home hero: full-width video sized to fit the screen (anchor b7e40c21, filled by heroVideo()), bar d2a7f1c3 with the CTAs */
[data-id="5dbad2d1"]{flex-direction:column!important;align-items:stretch!important;gap:0!important;padding:0!important}
[data-id="b7e40c21"]{display:block;width:100%;min-height:0}
.gc-hv{margin:0;width:100%;max-width:none!important}
/* Fit the whole frame under the 72px header: trim up to 12% of the height (the video's top 10% and bottom 3% are
   empty), then add side margins on very wide, short screens instead of trimming more. */
.gc-hv-frame{position:relative;margin-inline:auto;background:#111214;overflow:hidden;
  width:min(100%,(100vh - 72px)/.495);width:min(100%,(100svh - 72px)/.495);
  height:min(100vh - 72px,56.25vw);height:min(100svh - 72px,56.25vw)}
.gc-hv-frame video{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 79%}
[data-id="d2a7f1c3"]{display:flex!important;flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:16px 32px;width:min(100% - 128px,var(--layout-max,1280px));margin-inline:auto;padding:28px 0 36px!important}
[data-id="d2a7f1c3"] [data-id="2daf76da"]{position:absolute!important;width:1px!important;height:1px!important;margin:-1px!important;overflow:hidden!important;clip-path:inset(50%);white-space:nowrap}
@media (max-width:767px){
  [data-id="d2a7f1c3"]{width:auto;margin-inline:16px;padding:20px 0 28px!important}
}
</style>
<script>
(function(){
  function megaMenu(){
    var items=[].slice.call(document.querySelectorAll('details.gc-mega-item'));
    if(!items.length) return;
    var root=document.documentElement;
    var fine=window.matchMedia('(hover: hover) and (pointer: fine)');
    var scrim=document.createElement('div');
    scrim.className='gc-mega-scrim';
    document.body.appendChild(scrim);
    function sync(){ root.classList.toggle('gc-mega-open', items.some(function(d){ return d.open; })); }
    function closeAll(except){ items.forEach(function(d){ if(d!==except && d.open) d.open=false; }); sync(); }
    items.forEach(function(d){
      var timer, hoverOpenedAt=0, summary=d.querySelector('summary');
      d.addEventListener('toggle', function(){ if(d.open) closeAll(d); sync(); });
      d.addEventListener('mouseenter', function(){
        if(!fine.matches) return;
        clearTimeout(timer);
        timer=setTimeout(function(){ if(!d.open){ d.open=true; hoverOpenedAt=Date.now(); } }, 90);
      });
      d.addEventListener('mouseleave', function(){
        if(!fine.matches) return;
        clearTimeout(timer);
        timer=setTimeout(function(){ d.open=false; }, 220);
      });
      if(summary) summary.addEventListener('click', function(e){ if(d.open && Date.now()-hoverOpenedAt<700) e.preventDefault(); });
    });
    document.addEventListener('click', function(e){ if(!e.target.closest('details.gc-mega-item')) closeAll(); });
    document.addEventListener('keydown', function(e){
      if(e.key!=='Escape') return;
      var open=items.filter(function(d){ return d.open; })[0];
      if(!open) return;
      open.open=false; sync();
      var s=open.querySelector('summary'); if(s) s.focus();
    });
  }
  function calculators(){
    var boxes=[].slice.call(document.querySelectorAll('.gc-calc'));
    if(!boxes.length) return;
    function money(m){
      if(m>=100) return '$'+Math.round(m)+'M';
      if(m>=1) return '$'+(Math.round(m*10)/10).toString()+'M';
      return '$'+Math.round(m*1000)+'K';
    }
    boxes.forEach(function(box){
      function el(c){ return box.querySelector('.'+c); }
      var t=el('gc-calc-target'), a=el('gc-calc-acv'), w=el('gc-calc-win');
      if(!t||!a||!w) return;
      function put(c, v){ var n=el(c); if(!n || n.textContent===v) return; n.textContent=v; n.classList.remove('gc-pop'); void n.offsetWidth; n.classList.add('gc-pop'); }
      function calc(){
        var T=parseFloat(t.value), A=parseFloat(a.value), W=parseFloat(w.value);
        if(!(T>0) || !(A>0) || !(W>0) || W>100) return;
        var deals=T*1000/A, opps=deals/(W/100), pipe=opps*A/1000;
        put('gc-calc-pipeline', money(pipe));
        put('gc-calc-coverage', (pipe/T).toFixed(1)+'\u00d7');
        put('gc-calc-opps', Math.round(opps).toLocaleString());
        put('gc-calc-monthly', Math.round(opps/12).toLocaleString());
      }
      [t,a,w].forEach(function(i){ i.addEventListener('input', calc); });
      calc();
    });
    document.addEventListener('submit', function(e){
      if(e.target && e.target.closest && e.target.closest('.gc-calc')){ e.preventDefault(); e.stopImmediatePropagation(); }
    }, true);
  }
  function scheduler(){
    var d1=document.getElementById('gc-date-1'); if(!d1 || d1.dataset.gcSlots) return;
    var MT='America/Edmonton', SLOTS=[[12,13],[15,16],[16,17]], DAYS=10;
    // Google Calendar availability. Leave id or key empty to show every slot.
    var GCAL={id:'ckenny@growthmarketingpartners.ca',key:'AIzaSyDCoFIxok44yHFfL6fiJs5v3KeWttyvMZo'}, BUSY=null;
    function pad(n){ return (n<10?'0':'')+n; }
    function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
    function mtToday(){ var a=new Intl.DateTimeFormat('en-CA',{timeZone:MT,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
    function mtInstant(day,h){
      var guess=Date.UTC(day.getFullYear(),day.getMonth(),day.getDate(),h), p={};
      new Intl.DateTimeFormat('en-US',{timeZone:MT,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric'}).formatToParts(new Date(guess)).forEach(function(x){ p[x.type]=x.value; });
      return new Date(guess-(Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)-guess));
    }
    function hr(h){ return (h>12?h-12:h)+(h<12?' am':' pm'); }
    var tf=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'});
    var days=[], d=mtToday();
    while(days.length<DAYS || days[days.length-1].getDay()!==5){ d.setDate(d.getDate()+1); if(d.getDay()%6) days.push(new Date(d)); }
    function weekend(v){ var a=v.split('-'); return !(new Date(+a[0],+a[1]-1,+a[2]).getDay()%6); }
    function group(cls,label){ var g=document.createElement('div'); g.className='gc-slots '+cls; g.setAttribute('role','radiogroup'); g.setAttribute('aria-label',label); return g; }
    function pill(g,html,val,ctl){
      var b=document.createElement('button'); b.type='button'; b.className='gc-slot'; b.setAttribute('role','radio'); b.setAttribute('aria-checked','false'); b.dataset.value=val; b.innerHTML=html;
      b.addEventListener('click',function(){
        ctl.value=val; ctl.dispatchEvent(new Event('input',{bubbles:true})); ctl.dispatchEvent(new Event('change',{bubbles:true}));
      });
      g.appendChild(b); return b;
    }
    function sync(g,ctl){ [].forEach.call(g.children,function(b){ b.setAttribute('aria-checked',String(b.dataset.value===ctl.value)); }); }
    var pairs=[];
    [1,2].forEach(function(n){
      var di=document.getElementById('gc-date-'+n), ti=document.getElementById('gc-time-'+n); if(!di||!ti) return;
      di.dataset.gcSlots='1';
      di.min=iso(days[0]); di.max=iso(days[days.length-1]);
      var ph=ti.options[0]; if(ph && !/MT$/.test(ph.value)){ ph.value=''; ph.disabled=true; ti.value=''; }
      var dl=document.querySelector('label[for="gc-date-'+n+'"]'), tl=document.querySelector('label[for="gc-time-'+n+'"]');
      var dg=group('gc-slots-d',dl?dl.textContent.replace(' *',''):'Day');
      days.forEach(function(day,i){
        var b=pill(dg,'<small>'+day.toLocaleDateString('en-US',{weekday:'short'})+'</small>'+day.toLocaleDateString('en-US',{month:'short',day:'numeric'}),iso(day),di);
        if(!i) b.style.gridColumnStart=day.getDay();
      });
      var tg=group('gc-slots-t',tl?tl.textContent.replace(' *',''):'Time');
      var tp=SLOTS.map(function(s){ return pill(tg,hr(s[0]).replace(/ pm$/,'')+' to '+hr(s[1])+'<small class="gc-slot-local"></small>',ti.options[SLOTS.indexOf(s)+1]?ti.options[SLOTS.indexOf(s)+1].value:'',ti); });
      di.classList.add('gc-sr'); ti.classList.add('gc-sr'); di.tabIndex=-1; ti.tabIndex=-1;
      di.insertAdjacentElement('afterend',dg); ti.insertAdjacentElement('afterend',tg);
      function local(){
        var a=(di.value||iso(days[0])).split('-'), day=new Date(+a[0],+a[1]-1,+a[2]);
        tp.forEach(function(b,i){
          var s=mtInstant(day,SLOTS[i][0]), e=mtInstant(day,SLOTS[i][1]), same=s.getHours()===SLOTS[i][0] && s.getDate()===day.getDate();
          b.querySelector('.gc-slot-local').textContent=same?'':'Your time '+tf.format(s)+' to '+tf.format(e);
        });
      }
      di.addEventListener('change',function(){ di.setCustomValidity(di.value && weekend(di.value)?'We are not available on weekends. Please pick a weekday.':''); sync(dg,di); local(); check(); mark(); });
      ti.addEventListener('change',function(){ sync(tg,ti); check(); });
      local(); pairs.push([di,ti,dg,tg,tp]);
    });
    var b2=document.getElementById('gc-date-2'), t2=document.getElementById('gc-time-2');
    if(b2 && t2 && !b2.required){
      var c1=b2.closest('.e-con'), c2=t2.closest('.e-con');
      c1.classList.add('gc-hide-js'); c2.classList.add('gc-hide-js');
      var add=document.createElement('button'); add.type='button'; add.className='gc-addlink'; add.textContent='+ Add a backup time (optional)';
      add.addEventListener('click',function(){ c1.classList.remove('gc-hide-js'); c2.classList.remove('gc-hide-js'); add.remove(); var f=c1.querySelector('.gc-slot'); if(f) f.focus(); });
      c1.parentNode.insertBefore(add,c1);
    }
    function booked(day,i){
      if(!BUSY) return false;
      var s=+mtInstant(day,SLOTS[i][0]), e=+mtInstant(day,SLOTS[i][1]);
      return BUSY.some(function(b){ return b[0]<e && b[1]>s; });
    }
    function toDay(v){ var a=v.split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
    function mark(){
      if(!BUSY) return;
      pairs.forEach(function(p){
        var di=p[0], ti=p[1], dg=p[2], tg=p[3], tp=p[4];
        [].forEach.call(dg.children,function(b){
          var day=toDay(b.dataset.value), full=SLOTS.every(function(s,i){ return booked(day,i); });
          b.disabled=full; b.title=full?'Fully booked':'';
          if(full && di.value===b.dataset.value){ di.value=''; sync(dg,di); }
        });
        tp.forEach(function(b,i){
          var off=!!di.value && booked(toDay(di.value),i);
          b.disabled=off; b.title=off?'Already booked':'';
          if(off && ti.value===b.dataset.value){ ti.value=''; sync(tg,ti); }
        });
      });
    }
    function setBusy(list){ BUSY=list; mark(); }
    if(GCAL.id && GCAL.key && window.fetch){
      var t0=mtInstant(days[0],0).toISOString(), last=new Date(days[days.length-1]); last.setDate(last.getDate()+1);
      var t1=mtInstant(last,0).toISOString(), api='https://www.googleapis.com/calendar/v3/';
      fetch(api+'freeBusy?key='+encodeURIComponent(GCAL.key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({timeMin:t0,timeMax:t1,timeZone:MT,items:[{id:GCAL.id}]})})
        .then(function(r){ return r.json(); })
        .then(function(j){
          var c=j && j.calendars && j.calendars[GCAL.id];
          if(c && !c.errors && c.busy){ setBusy(c.busy.map(function(b){ return [Date.parse(b.start),Date.parse(b.end)]; })); return; }
          // Fallback: read events from a calendar shared publicly as free/busy
          return fetch(api+'calendars/'+encodeURIComponent(GCAL.id)+'/events?singleEvents=true&maxResults=250&timeMin='+encodeURIComponent(t0)+'&timeMax='+encodeURIComponent(t1)+'&key='+encodeURIComponent(GCAL.key))
            .then(function(r){ return r.json(); })
            .then(function(j){
              if(!j || !j.items) return;
              setBusy(j.items.filter(function(e){ return e.status!=='cancelled' && e.transparency!=='transparent'; }).map(function(e){
                var s=e.start.dateTime?Date.parse(e.start.dateTime):+mtInstant(toDay(e.start.date),0), f=e.end.dateTime?Date.parse(e.end.dateTime):+mtInstant(toDay(e.end.date),0);
                return [s,f];
              }));
            });
        })
        .catch(function(){});
    }
    function check(){
      if(pairs.length<2) return;
      var same=pairs[0][0].value && pairs[0][0].value===pairs[1][0].value && pairs[0][1].value && pairs[0][1].value===pairs[1][1].value;
      pairs[1][1].setCustomValidity(same?'Please pick a backup that differs from your first choice.':'');
    }
  }
  function focusPicker(){
    var fi=document.getElementById('gc-focus'); if(!fi || fi.dataset.gcPills) return; fi.dataset.gcPills='1';
    var msg=document.getElementById('gc-message');
    var OPTS=['Full pipeline diagnostic','Positioning and messaging','Pricing and packaging','Conversion rate optimization','Paid','Outbound','Partners','Content','Other'];
    var g=document.createElement('div'); g.className='gc-slots gc-slots-f'; g.setAttribute('role','group'); g.setAttribute('aria-label','What would you like to fix?');
    OPTS.forEach(function(o){
      var b=document.createElement('button'); b.type='button'; b.className='gc-slot'; b.setAttribute('aria-pressed','false'); b.textContent=o;
      b.addEventListener('click',function(){
        var on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',String(on));
        fi.value=[].filter.call(g.children,function(x){ return x.getAttribute('aria-pressed')==='true'; }).map(function(x){ return x.textContent; }).join(', ');
        if(o==='Other' && msg){ msg.classList.toggle('gc-hide-js',!on); msg.required=on; if(on) msg.focus(); }
      });
      g.appendChild(b);
    });
    fi.classList.add('gc-sr'); fi.tabIndex=-1; fi.insertAdjacentElement('afterend',g);
    if(msg) msg.classList.add('gc-hide-js');
  }
  function ticker(){ var t=document.querySelector('.elementor-element-2e05c5d3'); if(t && t.children[1]) t.children[1].setAttribute('aria-hidden','true'); }
  function heroVideo(){
    var box=document.querySelector('[data-id="b7e40c21"]'); if(!box || box.querySelector('video')) return;
    // Full HD (1080p, 60 fps) for laptops and desktops; a 720p copy for phones. The WebM is a fallback for browsers without H.264.
    var U='/wp-content/uploads/2026/10/', hd=(window.innerWidth||0)*(window.devicePixelRatio||1)>=1400;
    var SRC=U+(hd?'gmp-hero-1080p.mp4':'gmp-hero-720p-hq.mp4'), WEBM=U+'gmp-hero-720p.webm', POSTER=U+(hd?'gmp-hero-poster-1080p.jpg':'gmp-hero-poster.jpg');
    var still=window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    box.innerHTML='<figure class="gc-hv"><div class="gc-hv-frame"><video muted playsinline loop preload="'+(still?'none':'auto')+'" poster="'+POSTER+'"'+(still?' controls':' autoplay')+' aria-label="Growth Marketing Partners in 90 seconds: every revenue problem has a constraint, and we find it."><source src="'+SRC+'" type="video/mp4"><source src="'+WEBM+'" type="video/webm"></video></div></figure>';
  }
  function init(){ ticker(); megaMenu(); try{ heroVideo(); }catch(e){} calculators(); scheduler(); focusPicker(); }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>

<style>
/* GMP website tools: gated calculators injected after page sections (see gt.js) */
.gt-sec{padding:var(--section-space) var(--page-gutter);background:var(--surface);border-top:1px solid var(--line);color:var(--ink);font-family:var(--font-sans),sans-serif}
.gt-sec *{box-sizing:border-box}
.gt-in{max-width:var(--layout-max);margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--space-8);align-items:start}
.gt-intro{position:sticky;top:120px;display:flex;flex-direction:column;gap:var(--space-4)}
.gt-eye{display:flex;align-items:center;gap:10px;margin:0;font-family:var(--font-mono),monospace;font-size:var(--fs-eyebrow);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.gt-eye:before{content:"";width:8px;height:8px;background:var(--signal);flex:0 0 auto}
.gt-h2{margin:0;font-family:var(--font-serif),serif;font-weight:400;font-size:var(--fs-display-m);line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
.gt-lede{margin:0;font-size:var(--fs-body-l);line-height:1.6;color:var(--ink-2);max-width:var(--layout-measure)}
.gt-card{background:var(--surface-raised);border:1px solid var(--line);padding:var(--space-6);box-shadow:0 30px 60px -40px rgba(17,18,20,.45);display:flex;flex-direction:column;gap:var(--space-5)}
.gt-top{display:flex;justify-content:space-between;align-items:center;gap:var(--space-3)}

<script>
(function(){
  // GMP website tools. Each tool is injected after (or inside) an Elementor element on its page,
  // asks for name and work email before showing results, and emails the results through the
  // "Website tools" form (page 284, kept as a draft) so leads land in Elementor > Submissions.
  var FORM={post:284, id:'5bffcb2a', name:'Website tools'};
  var FORM_REQUEST={post:284, id:'8258be06', name:'Website tools: snapshot requests'}; // own email subjects
  var STORE='gmpToolsContact';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(v){
    var a=Math.abs(v), s=v<0?'-':'', r;
    if(a>=1e9) r=(a/1e9).toFixed(a>=1e10?0:1)+'B';
    else if(a>=1e6) r=(a/1e6).toFixed(a>=1e7?0:1)+'M';
    else if(a>=1e3) r=Math.round(a/1e3)+'K';
    else r=Math.round(a).toString();
    return s+'$'+r.replace(/\.0(?=[BMK])/,'');
  }
  function pct(v,d){ return (Math.round(v*Math.pow(10,d||0))/Math.pow(10,d||0)).toLocaleString('en-US')+'%'; }
  function num(v){ return Math.round(v).toLocaleString('en-US'); }
  function months(v){ return v>=100?'over 8 years':(Math.round(v*10)/10)+(Math.round(v*10)/10===1?' month':' months'); }
  function list(a){ return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }
  function store(){ try{ return JSON.parse(localStorage.getItem(STORE)||'{}'); }catch(e){ return {}; } }
  function save(o){ try{ localStorage.setItem(STORE,JSON.stringify(o)); }catch(e){} }

  // ---------- shared field helpers ----------
  function field(key,label,value,opts){
    opts=opts||{};
    return '<div class="gt-field"><label for="'+key+'">'+esc(label)+'</label><input type="number" inputmode="decimal" id="'+key+'" data-k="'+key.split('-').pop()+'" value="'+value+'" min="'+(opts.min!=null?opts.min:0)+'"'+(opts.max!=null?' max="'+opts.max+'"':'')+' step="any"></div>';
  }
  function val(card,k){ var i=card.querySelector('[data-k="'+k+'"]'); return i?parseFloat(i.value):NaN; }
  function textval(card,k){ var i=card.querySelector('[data-k="'+k+'"]'); return i?i.value.trim():''; }
  function need(cond,msg){ if(!cond) throw new Error(msg); }
  function summary(card){
    var out=[];
    [].forEach.call(card.querySelectorAll('.gt-form input'),function(i){
      if(i.type==='radio'){ if(i.checked) out.push(i.getAttribute('data-q')+': '+i.getAttribute('data-l')); return; }
      var l=card.querySelector('label[for="'+i.id+'"]'), lab=l?l.textContent:(i.getAttribute('aria-label')||i.id);
      if(i.value!=='') out.push(lab+': '+i.value);
    });
    return out.join(' · ');
  }
  function rowTable(prefix,rows,cols){
    var h='<div class="gt-scroll"><table class="gt-table"><thead><tr><th class="gt-th">'+esc(cols[0])+'</th>';
    cols.slice(1).forEach(function(c){ h+='<th class="gt-th" scope="col">'+esc(c.label)+'</th>'; });
    h+='</tr></thead><tbody>';
    rows.forEach(function(r,ri){
      h+='<tr>';
      if(r.editableName) h+='<td><input type="text" id="'+prefix+'-n'+ri+'" data-k="n'+ri+'" value="'+esc(r.name)+'" aria-label="'+esc(cols[0])+' '+(ri+1)+' name"></td>';
      else h+='<td class="gt-rowname">'+esc(r.name)+'</td>';
      cols.slice(1).forEach(function(c,ci){
        var k=c.k+ri;
        h+='<td><input type="number" inputmode="decimal" step="any" min="0" id="'+prefix+'-'+k+'" data-k="'+k+'" value="'+(r.v[ci]==null?'':r.v[ci])+'" aria-label="'+esc(r.name+' '+c.label)+'"></td>';
      });
      h+='</tr>';
    });
    return h+'</tbody></table></div>';
  }

  // ---------- the tools ----------
  var AREAS=['Funnel','Segments','Messaging','Pricing','Channels','Forecast'];
  var QUIZ=[
    ['Funnel','We know our conversion rate at every step from first touch to closed-won.'],
    ['Funnel','We know which step in the funnel loses us the most revenue.'],
    ['Segments','We can name the two or three segments where we win most often.'],
    ['Segments','Sales and marketing spend most of their time on those segments.'],
    ['Messaging','Our messaging comes from what buyers said in win-loss interviews.'],
    ['Messaging','A prospect could explain how we differ from the alternative in one sentence.'],
    ['Pricing','Reps rarely need a discount to close a deal.'],
    ['Pricing','Our packages fit how our buyers approve and sign for spend.'],
    ['Channels','We know the cost per qualified opportunity for each channel.'],
    ['Channels','We move budget based on what the next dollar buys, not the average.'],
    ['Forecast','Every rep uses the same written definitions for each pipeline stage.'],
    ['Forecast','Last quarter’s forecast landed within 10 percent of the actual number.']
  ];
  var SCALE=['Strongly disagree','Disagree','Not sure','Agree','Strongly agree'];
  var ADVICE={
    Funnel:'You can’t fix what you can’t see. Measure conversion at every step from first touch to closed-won, then work on the step that loses the most revenue.',
    Segments:'Effort is spread across buyers who don’t all convert. Score each segment on win rate, deal size, sales cycle and payback, then put budget and sales time into the best two or three.',
    Messaging:'Buyers can’t easily tell you apart. Rebuild the message from win-loss interviews and test it before anyone rewrites the website.',
    Pricing:'Discounting and package friction are likely costing you. Clear discount bands and packages that match how buyers approve spend usually pay back fastest.',
    Channels:'Budget is following averages instead of the next dollar. Track cost per qualified opportunity by channel and scale only where the marginal cost holds.',
    Forecast:'The forecast can’t be trusted until stages mean the same thing to every rep. Write down stage definitions and exit criteria first.'
  };

  var TOOLS=[
  { key:'quiz', name:'Go-to-market health check', anchor:'37eb8e98', where:'after',
    eyebrow:'Free health check', h2:'Where is your pipeline leaking?',
    lede:'Twelve statements, about two minutes. Score each one honestly and we’ll show you which of the six areas is most likely holding pipeline back.',
    tag:'Health check', title:'How much do you agree with each statement?', button:'See my score',
    form:function(id){
      var h='<div class="gt-qs">';
      QUIZ.forEach(function(q,i){
        h+='<fieldset class="gt-q"><legend><small>'+esc(q[0])+'</small>'+esc(q[1])+'</legend><div class="gt-scale">';
        SCALE.forEach(function(s,v){ h+='<label><input type="radio" name="'+id+'-q'+i+'" value="'+v+'" data-q="Q'+(i+1)+'" data-l="'+esc(s)+'"><span>'+esc(s)+'</span></label>'; });
        h+='</div></fieldset>';
      });
      return h+'</div>';
    },
    compute:function(card){
      var sc={}; AREAS.forEach(function(a){ sc[a]=0; });
      QUIZ.forEach(function(q,i){
        var c=card.querySelector('input[name$="-q'+i+'"]:checked');
        need(c,'Please answer all twelve statements (question '+(i+1)+' is missing).');
        sc[q[0]]+=parseInt(c.value,10);
      });
      var list=AREAS.map(function(a){ return {a:a,s:Math.round(sc[a]/8*100)}; });
      var overall=Math.round(list.reduce(function(t,x){ return t+x.s; },0)/list.length);
      var sorted=list.slice().sort(function(x,y){ return x.s-y.s; });
      var low=sorted[0];
      var bars='<div class="gt-bars">'+list.map(function(x){ return '<div class="gt-bar'+(x.a===low.a?' gt-low':'')+'"><span>'+x.a+'</span><i><b style="width:'+x.s+'%"></b></i><span>'+x.s+'</span></div>'; }).join('')+'</div>';
      return { hlabel:'Your likely constraint', headline:low.a, small:true,
        rows:[['Overall score',overall+' / 100'],['Lowest area',low.a+' ('+low.s+')'],['Next lowest',sorted[1].a+' ('+sorted[1].s+')'],['Strongest area',sorted[5].a+' ('+sorted[5].s+')'],['All six areas',list.map(function(x){ return x.a+' '+x.s; }).join(' · ')]],
        extra:bars, insight:ADVICE[low.a] };
    }
  },
  { key:'funnel', name:'Funnel leak finder', anchor:'1941beab', where:'after',
    eyebrow:'Funnel leak finder', h2:'Which step is losing you the most revenue?',
    lede:'Enter a typical month. We compare each step with a target and show what closing the gap at that one step would be worth in a year. Edit the targets to match your own.',
    tag:'Calculator', title:'Your funnel in a typical month', button:'Find my leak',
    form:function(id){
      return '<div class="gt-grid">'+field(id+'-v','Website visits',20000)+field(id+'-r','Demo requests',300)+field(id+'-m','Meetings held',180)+field(id+'-q','Qualified opportunities',90)+field(id+'-w','Closed-won deals',18)+field(id+'-a','Average first-year deal ($K)',40)+'</div>'
        +'<p class="gt-sub">Targets (%)</p><div class="gt-grid">'+field(id+'-t1','Visit to demo request',2,{max:100})+field(id+'-t2','Request to meeting held',70,{max:100})+field(id+'-t3','Meeting to qualified',50,{max:100})+field(id+'-t4','Qualified to closed-won',25,{max:100})+'</div>';
    },
    compute:function(card){
      var c=[val(card,'v'),val(card,'r'),val(card,'m'),val(card,'q'),val(card,'w')], A=val(card,'a')*1000;
      c.forEach(function(x){ need(x>0,'Enter a number above zero for every step.'); });
      need(A>0,'Enter your average first-year deal size.');
      for(var i=1;i<5;i++) need(c[i]<=c[i-1],'Each step should be smaller than the one before it.');
      var names=['Visit to demo request','Request to meeting held','Meeting to qualified','Qualified to closed-won'];
      var steps=names.map(function(n,i){
        var rate=c[i+1]/c[i]*100, t=val(card,'t'+(i+1));
        need(t>0&&t<=100,'Targets must be between 0 and 100.');
        var gain=rate<t?c[4]*(t/rate-1)*12*A:0;
        return {n:n,rate:rate,t:t,gain:gain};
      });
      var worst=steps.slice().sort(function(x,y){ return y.gain-x.gain; })[0];
      var rows=steps.map(function(s){ return [s.n+': '+pct(s.rate,1)+' (target '+pct(s.t,1)+')', s.gain>0?'+'+money(s.gain)+' a year at target':'At or above target']; });
      rows.push(['Closed-won deals a year', num(c[4]*12)+' ('+money(c[4]*12*A)+')']);
      if(worst.gain<=0) return {hlabel:'Every step is at or above target', headline:'No leak found', small:true, rows:rows,
        insight:'Your conversion holds up at every step against these targets. The next lever is volume or deal size, or tighter targets.'};
      return {hlabel:'Revenue lost at your worst step: '+worst.n, headline:money(worst.gain)+' a year', rows:rows,
        insight:'Fix '+worst.n.toLowerCase()+' first. Moving it from '+pct(worst.rate,1)+' to '+pct(worst.t,1)+' would add about '+num(worst.gain/A)+' deals a year without spending more on leads.'};
    }

      +'<button type="button" class="gt-btn gt-btn-signal gt-unlock">'+(t.request?'Send my request':'Show my results')+' \u2192</button></div>'
      +'<div class="gt-res gt-hide" aria-live="polite" tabindex="-1"></div>'
      +'</div></div></section>';
  }
  function resultHtml(r,note){
    var h='<div class="gt-hl"><span class="gt-tag">'+esc(r.hlabel)+'</span><p class="gt-num'+(r.small?' gt-num-s':'')+'">'+esc(r.headline)+'</p></div>';
    if(r.extra) h+=r.extra;
    h+='<dl class="gt-rows">'+r.rows.filter(function(x){ return x[0]; }).map(function(x){ return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'; }).join('')+'</dl>';
    h+='<p class="gt-insight">'+esc(r.insight)+'</p>';
    if(note) h+='<p class="gt-note'+(note.warn?' gt-warn':'')+'">'+esc(note.text)+'</p>';
    h+='<div class="gt-cta"><a class="gt-btn gt-btn-signal" href="/contact/">Book a call →</a><button type="button" class="gt-linkbtn gt-resend">Email me these results</button></div>';
    return h;
  }

  function send(t,r,c,card){
    var cfg=window.elementorFrontendConfig||{}, url=cfg.urls&&cfg.urls.ajaxurl, nonce=cfg.nonces&&cfg.nonces.atomicFormsSendForm;
    if(!url||!nonce||!window.fetch||!window.FormData) return Promise.resolve(false);
    var rows=r.rows.slice(0,5); while(rows.length<5) rows.push(['','']);
    var f=[['gname','Name',c.name,'text'],['gemail','Work email',c.email,'email'],['gcompany','Company',c.company||'Not given','text'],['tool','Tool',t.name,'text'],['page','Page',location.host+location.pathname,'text'],
      ['hlabel','Result label',r.hlabel,'text'],['headline','Result',r.headline,'text']];
    rows.forEach(function(x,i){ f.push(['r'+(i+1)+'l','Row '+(i+1)+' label',x[0]||' ','text']); f.push(['r'+(i+1)+'v','Row '+(i+1),x[1]||' ','text']); });
    f.push(['insight','What it means',r.insight,'text']); f.push(['inputs','Inputs',r.inputs||summary(card),'text']); f.push(['research','Benchmark research consent',c.research?'Yes':'No','text']);
    var nm=/^[A-Z][a-z]/.test(t.name)?t.name.charAt(0).toLowerCase()+t.name.slice(1):t.name;
    f.push(['esubj','Email subject',r.esubj||('Your '+nm+' results'),'text']); f.push(['etitle','Email title',r.etitle?r.etitle.replace('{name}',c.name):('Here are your results, '+c.name+'.'),'text']); f.push(['eintro','Email intro',r.eintro||'A copy of what you calculated on our website, so you can come back to it or share it with your team.','text']);
    var fd=new FormData();
    fd.append('action','elementor_pro_atomic_forms_send_form'); fd.append('_nonce',nonce);
    var F=t.request?FORM_REQUEST:FORM;
    fd.append('post_id',F.post); fd.append('form_id',F.id); fd.append('form_name',F.name);
    fd.append('referer_title',document.title); fd.append('referrer',location.href);
    f.forEach(function(x,i){ var p='form_fields['+i+']'; fd.append(p+'[id]',x[0]); fd.append(p+'[type]',x[3]); fd.append(p+'[label]',x[1]); fd.append(p+'[name]',x[0]); fd.append(p+'[options]','null'); fd.append(p+'[value]',x[2]); });
    var timeout=new Promise(function(res){ setTimeout(function(){ res(false); },10000); });
    var req=fetch(url,{method:'POST',body:fd,credentials:'same-origin'}).then(function(x){ return x.ok?x.json():null; }).then(function(j){ return !!(j&&j.success); }).catch(function(){ return false; });
    return Promise.race([req,timeout]);
  }

  function mount(t){
    var anchor=document.querySelector('[data-id="'+t.anchor+'"]');
    if(!anchor || document.getElementById('gt-'+t.key)) return;
    var wrap=document.createElement('div'); wrap.innerHTML=sectionHtml(t);
    var sec=wrap.firstChild;
    if(t.where==='append') anchor.appendChild(sec);
    else { var ref=anchor; while(ref.nextElementSibling&&ref.nextElementSibling.classList&&ref.nextElementSibling.classList.contains('gt-sec')) ref=ref.nextElementSibling; ref.parentNode.insertBefore(sec,ref.nextSibling); }
    var card=sec.querySelector('.gt-card'), err=card.querySelector('.gt-err'), go=card.querySelector('.gt-go'),
        gate=card.querySelector('.gt-gate'), gerr=card.querySelector('.gt-gate-err'), unlock=card.querySelector('.gt-unlock'), res=card.querySelector('.gt-res');
    var unlocked=false, last=null;
    var gn=gate.querySelector('[id$="-gn"]'), ge=gate.querySelector('[id$="-ge"]'), gc=gate.querySelector('[id$="-gc"]');
    var c0=store(); gn.value=c0.name||''; ge.value=c0.email||''; gc.value=c0.company||'';
    sec.querySelector('form').addEventListener('submit',function(e){ e.preventDefault(); go.click(); });
    function calc(){
      err.textContent='';
      try{ last=t.compute(card); }catch(e){ err.textContent=e.message; last=null; }
      return last;
    }
    function show(note){
      res.innerHTML=resultHtml(last,note); res.classList.remove('gt-hide');
      if(t.request){ var rb=res.querySelector('.gt-resend'); if(rb) rb.remove(); }
      res.querySelector('.gt-resend').addEventListener('click',function(){
        var b=this; b.disabled=true; b.textContent='Sending…';
        var r=calc(); if(!r){ b.disabled=false; b.textContent='Email me these results'; return; }
        send(t,r,store(),card).then(function(ok){ b.textContent=ok?'Sent. Check your inbox':'Couldn’t send just now'; });
      });
    }
    go.addEventListener('click',function(){
      if(!calc()) return;
      if(unlocked){ show(); return; }
      gate.classList.remove('gt-hide'); go.classList.add('gt-hide');
      (gn.value?(ge.value?unlock:ge):gn).focus();
    });
    unlock.addEventListener('click',function(){
      gerr.textContent='';
      var rb=gate.querySelector('.gt-research');
      var c={name:gn.value.trim(),email:ge.value.trim(),company:gc.value.trim(),research:!!(rb&&rb.checked)};
      if(!c.name){ gerr.textContent='Please enter your name.'; gn.focus(); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email)){ gerr.textContent='Please enter a valid work email.'; ge.focus(); return; }
      if(!calc()){ return; }
      save({name:c.name,email:c.email,company:c.company}); unlock.disabled=true; unlock.textContent='Sending…';
      send(t,last,c,card).then(function(ok){
        unlocked=true; gate.classList.add('gt-hide'); if(!t.request){ go.classList.remove('gt-hide'); go.textContent='Update my results \u2192'; }
        show(ok?{text:t.request?'We\u2019ve emailed a confirmation to '+c.email+'.':'We\u2019ve emailed a copy to '+c.email+'.'}:{text:t.request?'We couldn\u2019t send your request just now. Please try again in a moment.':'We couldn\u2019t email a copy just now, but here are your results.',warn:true});
        if(t.request&&!ok){ unlocked=false; gate.classList.remove('gt-hide'); unlock.disabled=false; unlock.textContent='Send my request \u2192'; }
        res.focus({preventScroll:true}); res.scrollIntoView({behavior:'smooth',block:'nearest'});
        try{ if(window.dataLayer) window.dataLayer.push({event:'gmp_tool_lead',tool:t.key}); }catch(e){}
      });
    });
  }


  // ---------- home page: build vs. partner card becomes a live calculator ----------
  function inhouse(){
    var total=document.querySelector('[data-id="2f8b5944"]');
    if(!total || total.closest('.gth-on')) return;
    var card=document.querySelector('[data-id="51ad9217"]') && total.closest('[data-id="570931b"]') || total.parentElement.parentElement;
    var roles=[['5d3a80e3','dd1530b',176000],['1af52347','1897d4e5',115750],['fefc3d4','649af03f',111000],['68d7e80c','402a71c9',108000],['5ea75ab5','333d4db',85500]];
    var q=function(id){ return document.querySelector('[data-id="'+id+'"]'); };
    if(roles.some(function(r){ return !q(r[0])||!q(r[1]); })) return;
    var root=total.closest('[data-id="38800e20"]')||document; root.classList.add('gth-on');
    var fmt=function(v){ return '$'+Math.round(v).toLocaleString('en-US'); };
    var box=function(cls,val,label,w){ return '<input type="number" inputmode="decimal" min="0" step="any" class="gth-in '+cls+'" value="'+val+'" aria-label="'+esc(label)+'"'+(w?' style="width:'+w+'"':'')+'>'; };
    roles.forEach(function(r,i){
      var l=q(r[0]), v=q(r[1]), name=l.textContent.trim();
      l.innerHTML='<label class="gth-role"><input type="checkbox" class="gth-chk" checked aria-label="Include '+esc(name)+'"><span>'+esc(name)+'</span></label>';
      v.innerHTML='<span class="gth-cur">$</span>'+box('gth-sal',r[2],name+' salary');
      r.push(l.querySelector('.gth-chk'), v.querySelector('.gth-sal'), name);
    });
    var bl=q('5aefb0dd'), bv=q('11e9dd50'), rl=q('791f4c25'), rv=q('765ae815');
    bl.innerHTML='Benefits and payroll at '+box('gth-ben',42.86,'Benefits and payroll as a percentage of salary','5.2em')+'% of salary';
    rl.innerHTML='Recruiting fees at '+box('gth-rec',20,'Recruiting fee percentage','4em')+'%';
    var head=q('5d681796'), eye=q('6e2c97f1'), teamV=q('2107fe2e'), vpV=q('2a32fcf5'), vpL=q('7221d3e');
    var barT=q('7a3159fa'), barV=q('46ff16'), barG=q('6c178c83');
    if(eye) eye.textContent='Hiring in-house · enter your own numbers';
    var words=['no','one','two','three','four','five'];
    var ben=root.querySelector('.gth-ben'), rec=root.querySelector('.gth-rec');
    var state={};
    function calc(){
      var b=Math.max(0,parseFloat(ben.value)||0)/100, f=Math.max(0,parseFloat(rec.value)||0)/100, sal=0, n=0, inc=[];
      roles.forEach(function(r){ var s=Math.max(0,parseFloat(r[4].value)||0); r[4].disabled=!r[3].checked; if(r[3].checked){ sal+=s; n++; inc.push(r[5]); } q(r[0]).parentElement.classList.toggle('gth-off',!r[3].checked); });
      var vpSal=Math.max(0,parseFloat(roles[0][4].value)||0);
      var tot=sal*(1+b+f), vp=vpSal*(1+b+f);
      total.textContent=fmt(tot); bv.textContent=fmt(sal*b); rv.textContent=fmt(sal*f);
      if(head) head.textContent='What a '+words[n]+'-person growth team costs in year one';
      if(teamV) teamV.textContent=fmt(tot);
      if(vpV) vpV.textContent=fmt(vp);
      if(vpL) vpL.textContent='One '+roles[0][5]+' hire';
      var max=Math.max(tot,vp,1);
      if(barT) barT.style.width=(tot/max*100)+'%';
      if(barV) barV.style.width=(vp/max*100)+'%';
      if(barG) barG.style.width=(vp*.25/max*100)+'%';
      state={tot:tot,sal:sal,b:b,f:f,vp:vp,n:n,inc:inc};
    }
    root.addEventListener('input',function(e){ if(e.target.closest('.gth-in,.gth-chk')) calc(); });
    root.addEventListener('change',function(e){ if(e.target.closest('.gth-chk')) calc(); });
    calc();
    // optional emailed breakdown, through the same gate as the other tools
    var note=q('5d4bb9f7'), host=note?note.parentElement:total.parentElement.parentElement;
    var g=document.createElement('div'); g.className='gth-gate';
    g.innerHTML='<button type="button" class="gt-linkbtn gth-open">Email me this breakdown</button>'
      +'<div class="gt-gate gt-hide"><div class="gt-grid"><div class="gt-field"><label for="gth-gn">Name *</label><input type="text" id="gth-gn" autocomplete="name"></div><div class="gt-field"><label for="gth-ge">Work email *</label><input type="email" id="gth-ge" autocomplete="email"></div><div class="gt-field"><label for="gth-gc">Company</label><input type="text" id="gth-gc" autocomplete="organization"></div></div>'
      +'<p class="gt-fine">We’ll email you this breakdown and may follow up once about it. See our <a href="/privacy-policy/">privacy policy</a>.</p>'+'<label class="gt-consent"><input type="checkbox" class="gt-research"> <span>Optional: include my numbers, anonymised, in Growth Marketing Partners\u2019 benchmark research. Nothing that identifies me or my company is ever published.</span></label>'+'<p class="gt-err" role="alert"></p><button type="button" class="gt-btn gt-btn-signal gth-send">Email my breakdown →</button></div><p class="gt-note gt-hide" aria-live="polite"></p>';
    host.appendChild(g);
    var gate=g.querySelector('.gt-gate'), err=g.querySelector('.gt-err'), msg=g.querySelector('.gt-note'), btn=g.querySelector('.gth-send');
    var gn=g.querySelector('#gth-gn'), ge=g.querySelector('#gth-ge'), gc=g.querySelector('#gth-gc'), c0=store();
    gn.value=c0.name||''; ge.value=c0.email||''; gc.value=c0.company||'';
    g.querySelector('.gth-open').addEventListener('click',function(){ gate.classList.remove('gt-hide'); this.classList.add('gt-hide'); (gn.value?ge:gn).focus(); });
    btn.addEventListener('click',function(){
      err.textContent='';
      var rb=g.querySelector('.gt-research');
      var c={name:gn.value.trim(),email:ge.value.trim(),company:gc.value.trim(),research:!!(rb&&rb.checked)};
      if(!c.name){ err.textContent='Please enter your name.'; gn.focus(); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email)){ err.textContent='Please enter a valid work email.'; ge.focus(); return; }
      calc(); save({name:c.name,email:c.email,company:c.company}); btn.disabled=true; btn.textContent='Sending…';
      var s=state, r={hlabel:'First-year cost of your in-house growth team', headline:fmt(s.tot),
        rows:[['Roles included',s.inc.length?s.inc.join(', '):'None'],['Salaries',fmt(s.sal)],['Benefits and payroll at '+Math.round(s.b*1000)/10+'%',fmt(s.sal*s.b)],['Recruiting fees at '+Math.round(s.f*1000)/10+'%',fmt(s.sal*s.f)],['One '+roles[0][5]+' hire, all in',fmt(s.vp)]],
        insight:'That is before bonuses, equity, software and the months it takes to hire and ramp a new team. Growth Marketing Partners typically comes in about 75% below the cost of hiring one senior leader, depending on scope.',
        inputs:roles.map(function(x){ return x[5]+': '+(x[3].checked?fmt(parseFloat(x[4].value)||0):'not included'); }).join(' · ')+' · Benefits and payroll: '+ben.value+'% · Recruiting fee: '+rec.value+'%'};
      send({name:'In-house team cost calculator'},r,c,g).then(function(ok){
        gate.classList.add('gt-hide'); msg.classList.remove('gt-hide');
        msg.classList.toggle('gt-warn',!ok);
        msg.textContent=ok?'Sent. We’ve emailed this breakdown to '+c.email+'.':'We couldn’t send it just now. Please try again in a moment.';
        if(!ok){ btn.disabled=false; btn.textContent='Email my breakdown →'; gate.classList.remove('gt-hide'); }
        try{ if(ok&&window.dataLayer) window.dataLayer.push({event:'gmp_tool_lead',tool:'inhouse'}); }catch(e){}
      });
    });
  }
  function init(){ TOOLS.forEach(function(t){ try{ mount(t); }catch(e){ if(window.console) console.warn('GMP tool '+t.key,e); } }); try{ inhouse(); }catch(e){ if(window.console) console.warn('GMP in-house calculator',e); } try{ hub(); deeplink(); }catch(e){} }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
})();
</script>
